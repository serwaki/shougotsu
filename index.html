const activeFocusSections=[['study','▤','Учёба'],['blog','▣','Медийка']];
const focusSections=[...activeFocusSections,['work','◇','Развитие'],['typing','⌨','Monkeytype']];
function focusClockText(seconds){const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),sec=seconds%60;return (h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}function focusParticles(){return Array.from({length:22},(_,i)=>{const a=(i*137.508)*Math.PI/180,r=70+(i%5)*10;return '<i style="--px:'+(Math.cos(a)*r).toFixed(1)+'px;--py:'+(Math.sin(a)*r).toFixed(1)+'px;--delay:-'+(i*.17%3.8).toFixed(2)+'s;--life:'+(2.8+(i%6)*.24)+'s;--size:'+(2+i%4)+'px"></i>'}).join('')}function focusDaySeconds(day,section){return Math.max(0,state.focus.filter(f=>f.day===day&&f.section===section).reduce((sum,f)=>sum+(Number.isFinite(f.seconds)?f.seconds:Math.round((Number(f.minutes)||0)*60)),0))}
function subtractFocus(day,section,seconds){if(!focusSections.some(x=>x[2]===section)||!/^\d{4}-\d{2}-\d{2}$/.test(day)||day>date()||!Number.isSafeInteger(seconds)||seconds<=0||seconds>focusDaySeconds(day,section))return false;state.focus.push({day,section,seconds:-seconds,minutes:-seconds/60,kind:'correction',id:uid()});save();render();return true}
function updateFocusCorrection(adding=false){const day=$('focusCorrectionDate').value,section=$('focusCorrectionSection').value,available=focusDaySeconds(day,section);$('focusCorrectionAvailable').textContent='Записано за этот день: '+focusTime(available);if(!adding)$('focusCorrectionMinutes').max=Math.floor(available/60)}
function openFocusCorrection(adding=false){const form=$('form');$('modalTitle').textContent=adding?'Добавить время фокуса':'Убрать время фокуса';$('fields').innerHTML='<p class="muted">'+(adding?'Укажи, сколько времени ты занимался.':'Вычти только ошибочно засчитанное время.')+'</p><label>Дата<input id="focusCorrectionDate" type="date" value="'+date()+'" max="'+date()+'" required onchange="updateFocusCorrection('+adding+')"></label><label>Категория<select id="focusCorrectionSection" onchange="updateFocusCorrection('+adding+')">'+(adding?activeFocusSections:focusSections).map(x=>'<option '+(x[2]===timer.section?'selected':'')+'>'+esc(x[2])+'</option>').join('')+'</select></label><p id="focusCorrectionAvailable" class="pill"></p><div class="formline"><label>Минуты<input id="focusCorrectionMinutes" type="number" min="0" step="1" value="0" required></label><label>Секунды<input id="focusCorrectionSeconds" type="number" min="0" max="59" step="1" value="0" required></label></div>';updateFocusCorrection(adding);const commit=()=>{if(!form.reportValidity())return;const seconds=Number($('focusCorrectionMinutes').value)*60+Number($('focusCorrectionSeconds').value),day=$('focusCorrectionDate').value,section=$('focusCorrectionSection').value;if(adding){
  if(!Number.isSafeInteger(seconds)||seconds<=0){notify('Укажи время больше нуля');return}
  state.focus.push({day,section,minutes:seconds/60,seconds});
  save();
  render();
}else if(!subtractFocus(day,section,seconds)){notify('Укажи время не больше записанного и больше нуля');return}$('modal').close();notify((adding?'Добавлено: ':'Вычтено: ')+focusTime(seconds))};$('saveEdit').onclick=commit;form.onsubmit=e=>{e.preventDefault();commit()};form.onkeydown=null;$('modal').showModal()}
function timerCard(){return '<section class="card timer"><div class="cardhead"><h2>◷ Таймер фокуса</h2><select style="width:130px" onchange="timer.section=this.value" '+(timer.active?'disabled':'')+'>'+activeFocusSections.map(x=>'<option '+(timer.section===x[2]?'selected':'')+'>'+x[2]+'</option>').join('')+'</select></div><small>За неделю: '+focusTime(focusSeconds())+'</small><div class="clock '+(timer.running?'focus-running':'')+'"><div class="focus-particles" aria-hidden="true">'+(timer.running?focusParticles():'')+'</div><strong id="clock">'+focusClockText(timer.left)+'</strong><small>ВРЕМЯ ФОКУСА</small></div><label style="color:white">Длительность: 1 мин — 5 часов</label><input id="focusRange" type="range" min="1" max="300" step="1" value="'+timer.duration/60+'" oninput="setDuration(+this.value)" '+(timer.active?'disabled':'')+'><div class="focus-duration-input"><input id="focusMinutes" type="number" min="1" max="300" step="1" value="'+timer.duration/60+'" aria-label="Длительность в минутах" onchange="setDuration(+this.value)" '+(timer.active?'disabled':'')+'><span>мин</span></div><div class="row spread"><small id="duration">'+focusTime(timer.duration)+'</small><div class="row focus-buttons"><button onclick="resetTimer()" title="Сбросить без сохранения">↺</button><button class="primary" onclick="startTimer()" id="timerToggle">'+(timer.running?'Пауза':timer.active?'Продолжить':'Старт')+'</button><button class="focus-finish" onclick="finishFocus(false)" '+(timer.active?'':'disabled')+'>Закончить</button></div></div><button class="focus-adjust" onclick="openFocusCorrection(true)">+ Добавить время</button><button class="focus-adjust" onclick="openFocusCorrection()">− Убрать записанное время</button></section>'}function updateClock(){let e=$('clock');if(e)e.textContent=focusClockText(timer.left)}function setDuration(n){if(timer.active)return;n=Math.max(1,Math.min(300,Math.round(Number(n)||1)));timer.duration=timer.left=n*60;updateClock();$('duration').textContent=focusTime(timer.duration);if($('focusRange'))$('focusRange').value=n;if($('focusMinutes'))$('focusMinutes').value=n}let focusAudio=null;
function enableFocusAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!focusAudio||focusAudio.state==='closed')focusAudio=new C();if(focusAudio.state!=='running')focusAudio.resume().catch(()=>{});}catch{}}
async function playFocusEnd(){try{if(!focusAudio)return;if(focusAudio.state!=='running')await focusAudio.resume();const now=focusAudio.currentTime;[523.25,659.25,783.99,1046.50].forEach((hz,i)=>{const t=now+i*.21,o=focusAudio.createOscillator(),g=focusAudio.createGain();o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.48);o.connect(g);g.connect(focusAudio.destination);o.start(t);o.stop(t+.5)})}catch{}}
function refreshFocusLeft(){if(timer.running)timer.left=Math.max(0,Math.ceil((timer.end-Date.now())/1000))}
function startTimer(){enableFocusAudio();if(timer.running){refreshFocusLeft();if(!timer.left){finishFocus(true);return}timer.running=false}else{timer.active=true;timer.running=true;timer.end=Date.now()+timer.left*1000}render()}
function resetTimer(){timer.running=false;timer.active=false;timer.left=timer.duration;render()}
function finishFocus(natural=false){if(!timer.active)return;refreshFocusLeft();const elapsed=Math.max(0,timer.duration-timer.left);timer.running=false;timer.active=false;timer.left=timer.duration;if(elapsed>0){state.focus.push({day:date(),section:timer.section,minutes:elapsed/60,seconds:elapsed});save()}render();if(natural)playFocusEnd();notify(elapsed?'Фокус завершён · '+focusTime(elapsed)+' сохранено':'Фокус завершён')}
setInterval(()=>{if(timer.running){refreshFocusLeft();if(!timer.left)finishFocus(true)}updateClock()},250)

function weekReviewCard(){let current=date(),start=shift(current,-6),list=state.tasks.filter(t=>t.day>=start&&t.day<=current),n=list.filter(t=>t.done).length;return card('Итоги последних 7 дней','<div class="metric-row"><div><strong>'+n+'/'+list.length+'</strong><small>Задачи</small></div><div><strong>'+Array.from({length:7},(_,i)=>shift(start,i)).filter(d=>state.days[d]?.closed===true).length+'</strong><small>Закрытые дни</small></div><div><strong>'+focusTime(focusSeconds())+'</strong><small>Время в фокусе</small></div></div>')}
function habitMonthPercent(){let dates=monthDays().filter(d=>d<=today),total=state.habits.length*dates.length,done=state.habits.reduce((n,h)=>n+dates.filter(d=>h.days[d]).length,0);return total?Math.round(done/total*100):0}
function habitOverview(){return '<div class="habit-progress"><div class="row spread"><b>Регулярность за месяц</b><strong>'+habitMonthPercent()+'%</strong></div><div class="bar"><i style="width:'+habitMonthPercent()+'%"></i></div><small>Учитываются только прошедшие дни и сегодня.</small></div>'}

const speechChapters=[["Перепёлка","Перепёлка перепелят прятала от ребят."],["Бобры","Добры бобры идут в боры, а бобры для бобрят добры."],["Кукушка","Купила кукушка кукушонку капюшон. Надел кукушонок капюшон — как в капюшоне он смешон!"],["Выдра","Выдра из ведра выпрыгнула, воду из ведра выплеснула."],["Щука","Щуку я тащу, тащу, щуку я не упущу."],["Горошина","Горошина к горошине, хороша горошина."],["Краб","Краб крабу сделал грабли. Подал грабли крабу краб: «Грабь граблями гравий, краб!»"],["Пекарь","Пётр Петрович, по прозванию Перов, поймал птицу пигалицу, понёс по рынку, просил полтинку."],["Варенье","Варвара варила, варила варенье, да так и не выварила варенье."],["Фотограф","Фотограф фотографировал фотографа, фотографии которого фотографировал другой фотограф."],["Регулировщик","Регулировщик лигуриец регулировал в Лигурии."],["Флюорограф","Флюорографист флюорографировал флюорографом флюорограмму."]];
const speechStages=[['Контроль речи','3 мин','Чётко произноси начало и конец каждого слова. Не проглатывай гласные.','Красивая и грамотная речь помогает человеку уверенно выражать свои мысли. Каждое слово должно звучать ясно и выразительно.'],['Артикуляция','3 мин','Активно, но без напряжения двигай губами и языком.','А — О — У — И — Э — Ы.\nБра — бро — бру — бри — брэ.\nТра — тро — тру — три — трэ.\nКра — кро — кру — кри — крэ.'],['Скороговорки','5 мин','Выбери несколько скороговорок из списка прямо под этим упражнением. Повтори каждую 3–5 раз в удобном темпе.','Сначала чёткость, затем плавность, затем скорость.'],['Декламация','5 мин','Прочитай текст спокойно, радостно, уверенно, возмущённо и вдохновляюще. Меняй паузы и смысловые акценты.','Иногда достаточно сделать первый шаг, чтобы изменить многое в своей жизни. Не обязательно знать весь путь. Важно найти в себе смелость начать и продолжать двигаться вперёд.']];
const dailySpeechTexts=[["Внимательность помогает замечать детали, которые обычно остаются незамеченными. Чем спокойнее мы наблюдаем, тем точнее понимаем происходящее.","Представь утро в незнакомом городе. На улицах ещё тихо, а в окнах постепенно появляется свет. Кто-то торопится на работу, кто-то открывает маленькую кофейню. В такие моменты особенно ясно чувствуешь, что каждый день может начаться с чего-то нового."],["Человек увереннее выражает мысли, когда не торопится. Чёткие окончания и небольшие паузы помогают собеседнику услышать каждое слово.","Вечером я вышел на прогулку и неожиданно остановился возле старого дерева. Его ветви качались от ветра, а листья едва слышно шелестели. Я подумал, что порой полезно остановиться, оглядеться и дать себе немного времени на размышления."],["Чтобы освоить сложный навык, важно разбить его на небольшие шаги. Регулярная практика постепенно превращает трудное в привычное.","Первый проект редко получается идеальным. Иногда приходится переделывать один и тот же фрагмент несколько раз. Но именно в процессе поиска рождаются интересные решения. Вчерашняя ошибка может стать сегодняшней находкой, если не бояться её исправлять."],["На тихой улице слышались шаги, шелест листьев и редкие голоса прохожих. Каждая деталь добавляла особое настроение.","В небольшом кафе за окном шёл дождь. На столе стояла чашка горячего чая, и рядом лежал раскрытый блокнот. Планы на день неожиданно изменились, но настроение не испортилось. Иногда случайная пауза помогает увидеть то, что в спешке было бы невозможно заметить."],["Хороший рассказ требует ясной мысли, точных слов и выразительной подачи. Слушатель должен легко следить за развитием событий.","Однажды друг предложил отправиться в поездку без заранее составленного маршрута. Мы выбрали направление и отправились в путь. По дороге обнаружили красивый парк, маленькую пекарню и необычный мост. Самыми запоминающимися оказались именно незапланированные моменты."],["На берегу реки ветер разгонял лёгкие облака, а солнечные лучи отражались от поверхности воды.","Когда заканчивается трудный день, хочется просто отдохнуть. Однако иногда короткое дело, которое давно откладывал, приносит неожиданное удовлетворение. Не нужно делать всё сразу. Достаточно спокойно решить, что важнее сейчас, и начать с этого."],["Продуманный ритм речи делает даже обычную историю интересной. Меняй интонацию, но сохраняй естественность произношения.","На выставке я заметил картину, мимо которой сначала прошёл. Вернувшись, увидел множество мелких деталей: свет, тени, необычное сочетание цветов. Впечатление оказалось совсем другим. Возможно, некоторые вещи требуют не быстрого взгляда, а внимательного знакомства."],["В каждом разговоре важно не только говорить, но и слушать. Точный вопрос иногда помогает понять человека лучше длинного объяснения.","Новый навык напоминает дорогу, на которой не всегда виден следующий поворот. Поначалу приходится действовать осторожно, затем появляется уверенность. Иногда полезно вернуться на несколько шагов назад, чтобы лучше разобраться. Главное — не терять интерес к самому процессу."],["Утренний воздух был прохладным, а над крышами медленно поднималось солнце. Город постепенно просыпался.","Мы собрались у большого окна, чтобы обсудить идею нового проекта. Каждый предложил своё решение. Сначала мнения сильно расходились, но постепенно из разных предложений сложился общий замысел. Оказалось, что разные взгляды могут не мешать, а дополнять друг друга."],["Плавность речи зависит от спокойного дыхания и точного произношения. Не пытайся ускоряться раньше, чем почувствуешь уверенность.","В старом книжном магазине стояла необычная тишина. На полках лежали книги с потёртыми обложками. Я открыл одну из них и прочитал несколько страниц. История оказалась настолько интересной, что я забыл о времени и продолжил читать."],["Свет, цвет и движение помогают передавать настроение. Даже простая композиция может выглядеть выразительно.","На пустой спортивной площадке раздавался звук мяча. Кто-то повторял одно движение снова и снова. Со стороны это могло казаться скучным, но каждое повторение становилось немного точнее предыдущего. Так незаметно формируется мастерство."],["Когда мысль сформулирована ясно, слова находят своё место. Короткая пауза помогает подчеркнуть главное.","Я долго пытался найти подходящее решение одной задачи. Сначала всё казалось слишком сложным. Потом я записал отдельные вопросы и начал отвечать на них по очереди. Через некоторое время проблема стала понятнее, и появился план, которому можно было следовать."],["Внимательно произноси согласные, не сокращай гласные и сохраняй естественный темп. Пусть каждое слово будет слышно.","Вечерний поезд медленно приближался к станции. За окном проплывали огни домов и тёмные силуэты деревьев. Пассажиры собирали вещи, а кто-то продолжал смотреть вдаль. В этой обычной сцене было что-то спокойное и немного загадочное."],["Иногда выразительность начинается с простого изменения интонации. Попробуй выделять ключевые слова, не повышая голос без необходимости.","Маленькая команда завершила работу над проектом. На экране появился результат, который ещё недавно существовал только в воображении. Все заметили, что идея изменилась по ходу работы. Именно эксперименты помогли сделать её интереснее, чем первоначальный замысел."]],dailyMotionTasks=["Анимируй появление заголовка с overshoot и плавным затуханием.","Сделай зацикленное движение геометрической фигуры.","Собери короткий transition из трёх простых форм.","Создай анимацию с эффектом упругого отскока.","Отработай Graph Editor: добейся естественного ускорения и торможения.","Сделай параллакс из 3 слоёв.","Анимируй текст по буквам с небольшим stagger.","Создай минималистичный логотип-ревил.","Собери 3-секундную сцену с масками и раскрытием.","Сделай анимацию объекта с эффектом инерции.","Анимируй полосы и окружности под ритм.","Сделай плавный переход между двумя цветами и формами.","Отработай управление несколькими слоями через Null Object.","Создай короткую петлю с анимацией масштаба и поворота."],dailyArticulation=["А — О — У — И — Э — Ы.\nБра — бро — бру — бри — брэ.\nТра — тро — тру — три — трэ.","Ма — мо — му — ми — мэ.\nПа — по — пу — пи — пэ.\nБа — бо — бу — би — бэ.","Са — со — су — сы — сэ.\nЗа — зо — зу — зы — зэ.\nЦа — цо — цу — цы — цэ.","Ша — шо — шу — ши — шэ.\nЖа — жо — жу — жи — жэ.\nЧа — чо — чу — чи — чэ.","Ла — ло — лу — ли — лэ.\nРа — ро — ру — ри — рэ.\nЛра — лро — лру — лри.","Кра — кро — кру — кри — крэ.\nГра — гро — гру — гри — грэ.\nДра — дро — дру — дри — дрэ.","Пта — пто — пту — пти — птэ.\nКта — кто — кту — кти — ктэ.\nСтра — стро — стру — стри — стрэ."],dailyTopics=["Расскажи, как ты выбираешь музыкальный трек для видео.","Объясни, чему тебя научила последняя ошибка.","Опиши идеальный рабочий день.","Расскажи о любимом автомобиле и почему он тебе нравится.","Объясни, что отличает хорошую анимацию от скучной.","Представь, что советуешь фильм другу.","Расскажи, как бы ты организовал путешествие.","Опиши навык, который хотел бы освоить.","Почему людям бывает сложно начать новое дело?","Расскажи о месте, которое тебя удивило.","Объясни, как проходит твоя тренировка.","Расскажи, какая музыка помогает тебе сосредоточиться.","Опиши интересную идею для видео.","Расскажи, какой проект ты хотел бы создать через год."];
function developmentDayIndex(day=date()){return Math.floor(Date.parse(day+'T00:00:00Z')/86400000)}
function dailyPick(list,day=date()){return list[((developmentDayIndex(day)%list.length)+list.length)%list.length]}
function dailySpeechStages(){const [control,declamation]=dailyPick(dailySpeechTexts);return speechStages.map((stage,i)=>i===0?[...stage.slice(0,3),control]:i===1?[...stage.slice(0,3),dailyPick(dailyArticulation)]:i===3?[...stage.slice(0,3),declamation]:stage)}
function dailyMotionCard(){return '<div class="train-panel"><b>Практика дня · '+esc(fmt(date()))+'</b><p>'+esc(dailyPick(dailyMotionTasks))+'</p><small>15–30 минут · можно добавить задачу в план.</small></div>'}
function speechRequired(){return [...speechWarmup.map((_,i)=>'warm'+i),...speechStages.map((_,i)=>'stage'+i)]}
function speechCheck(key){state.speechPractice??={};let d=state.speechPractice[date()]??={};if(d.completed)return;d[key]=!d[key];save();render()}
function finishSpeechTraining(){state.speechPractice??={};const d=state.speechPractice[date()]??={};if(d.completed)return;if(!speechRequired().every(key=>d[key])){notify('Сначала выполни все упражнения');return}d.completed=true;state.points=(Number(state.points)||0)+1;save();render();notify('Тренировка речи завершена · +1 балл')}
function speechProgress(done){const keys=speechRequired(),count=keys.filter(k=>done[k]).length,pct=Math.round(count/keys.length*100);return '<section class="speech-progress"><div class="row spread"><b>Прогресс тренировки</b><strong>'+count+'/'+keys.length+' · '+pct+'%</strong></div><div class="bar" role="progressbar" aria-label="Прогресс тренировки речи" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div><small>'+ (done.completed?'✓ Тренировка завершена · +1 балл':'Разминка и 4 основных упражнения. Скороговорки выбирай по желанию.')+'</small></section>'}

 },from(table){let method='GET',payload,params=new URLSearchParams();const q={select(cols){params.set('select',cols);return q},eq(k,v){params.set(k,'eq.'+String(v));return q},insert(v){method='POST';payload=v;return q},update(v){method='PATCH';payload=v;return q},async maybeSingle(){try{const token=await getToken();const rows=await request('/rest/v1/'+encodeURIComponent(table)+'?'+params.toString(),method,payload,token,method==='GET'?undefined:'return=representation');if(!Array.isArray(rows)||rows.length>1)throw Error('Непредвиденный ответ сервера');return {data:rows[0]||null,error:null}}catch(error){return {data:null,error}}},async single(){const result=await q.maybeSingle();if(!result.error&&!result.data)result.error=Error('Запись не найдена');return result}};return q}}
}

async function initCloud(){cloud=createJournalCloud();const {data,error}=await cloud.auth.getSession();if(!error&&data?.session)await cloudAttach(data.session);cloud.auth.onAuthStateChange((event,session)=>{if(event==='TOKEN_REFRESHED'&&session)cloudSession=session;else if(event==='SIGNED_OUT'){cloudGeneration++;cloudSession=null;cloudReady=false;cloudConflict=null;cloudSetStatus('Облако не подключено')}});setInterval(()=>cloudSync(),15000);window.addEventListener('focus',()=>cloudSync());window.addEventListener('online',()=>cloudSync())}
async function cloudRow(){const {data,error}=await cloud.from('journal_sync').select('journal,revision').eq('user_id',cloudSession.user.id).maybeSingle();if(error)throw error;return data}
function cloudAdopt(row){if(!row||!row.journal||!Object.keys(seed).every(k=>Object.hasOwn(row.journal,k))){cloudSetStatus('Облачная запись имеет неподдерживаемый формат');return false}if(!cloudBackup()){cloudSetStatus('Не удалось создать локальную резервную копию');return false}cloudReady=false;state=row.journal;setCloudMeta({user:cloudSession.user.id,revision:row.revision,hash:cloudHash(state)});save();render();cloudReady=true;cloudConflict=null;cloudSetStatus('✓ Синхронизировано');return true}
async function cloudAttach(session){cloudGeneration++;cloudSession=session;cloudReady=false;cloudConflict=null;cloudSetStatus('Подключение…');try{const row=await cloudRow(),meta=cloudMeta();if(!row){cloudConflict={type:'first'};cloudSetStatus('Нужно выбрать данные для первого сохранения');openCloud();return}if(meta.user===session.user.id&&meta.revision===row.revision){cloudReady=true;await cloudSync();return}if(meta.user===session.user.id&&meta.hash!==cloudHash(state)){cloudConflict={type:'conflict',row};cloudSetStatus('Есть изменения на двух устройствах');openCloud();return}cloudAdopt(row)}catch(e){cloudSetStatus('Ошибка подключения. Открой «Облако» для повтора')}}
async function cloudSync(){if(!cloudReady||!cloudSession||cloudBusy||cloudConflict)return;cloudBusy=true;const gen=cloudGeneration;try{const row=await cloudRow();if(gen!==cloudGeneration)return;const meta=cloudMeta(),hash=cloudHash(state);if(!row){cloudReady=false;cloudConflict={type:'first'};cloudSetStatus('Облачная запись отсутствует');return}if(row.revision!==meta.revision){if(hash===meta.hash){cloudAdopt(row);return}cloudConflict={type:'conflict',row};cloudSetStatus('Конфликт · открой «Облако»');return}if(hash===meta.hash){cloudSetStatus('✓ Синхронизировано');return}const journal=cloudSnapshot(),{data,error}=await cloud.from('journal_sync').update({journal,revision:row.revision+1,updated_at:new Date().toISOString()}).eq('user_id',cloudSession.user.id).eq('revision',row.revision).select('revision').maybeSingle();if(gen!==cloudGeneration)return;if(error)throw error;if(!data){cloudConflict={type:'conflict',row:await cloudRow()};cloudSetStatus('Конфликт · открой «Облако»');return}setCloudMeta({user:cloudSession.user.id,revision:data.revision,hash:cloudHash(journal)});cloudSetStatus('✓ Синхронизировано');if(cloudHash(state)!==cloudHash(journal))cloudChanged()}catch(e){cloudSetStatus('Нет связи · изменения сохранены на устройстве')}finally{cloudBusy=false}}
async function cloudFirst(){if(!cloudSession||cloudBusy)return;cloudBusy=true;try{const journal=cloudSnapshot(),{data,error}=await cloud.from('journal_sync').insert({user_id:cloudSession.user.id,journal}).select('revision').single();if(error)throw error;setCloudMeta({user:cloudSession.user.id,revision:data.revision,hash:cloudHash(journal)});cloudConflict=null;cloudReady=true;cloudSetStatus('✓ Синхронизировано');if($('cloudDialog'))$('cloudDialog').close();cloudChanged()}catch{cloudSetStatus('Не удалось сохранить. Повтори подключение.')}finally{cloudBusy=false}}
async function cloudUseRemote(){if(!cloudSession||cloudBusy)return;cloudBusy=true;try{const row=await cloudRow();if(row&&cloudAdopt(row))$('cloudDialog')?.close()}catch{cloudSetStatus('Нет связи с облаком')}finally{cloudBusy=false}}
async function cloudUseLocal(){if(!cloudSession||cloudBusy)return;cloudBusy=true;try{let row=await cloudRow();if(!row){cloudSetStatus('Облачная запись отсутствует');return}try{localStorage.setItem('life-journal-cloud-remote-backup-v1',JSON.stringify(row.journal))}catch{cloudSetStatus('Не удалось сохранить резервную копию');return}const journal=cloudSnapshot(),{data,error}=await cloud.from('journal_sync').update({journal,revision:row.revision+1,updated_at:new Date().toISOString()}).eq('user_id',cloudSession.user.id).eq('revision',row.revision).select('revision').maybeSingle();if(error||!data)throw Error('conflict');setCloudMeta({user:cloudSession.user.id,revision:data.revision,hash:cloudHash(journal)});cloudConflict=null;cloudReady=true;cloudSetStatus('✓ Синхронизировано');$('cloudDialog')?.close();cloudChanged()}catch{cloudSetStatus('Изменения не заменены. Попробуй снова.')}finally{cloudBusy=false}}
function openCloud(mode='login',prefill=''){let dlg=$('cloudDialog');const email=prefill||$('cloudEmail')?.value||'';if(dlg){dlg.close();dlg.remove()}dlg=document.createElement('dialog');dlg.id='cloudDialog';dlg.className='modal cloud-dialog';let body='<div class="cardhead"><h2>'+(!cloudSession&&mode==='register'?'Создание аккаунта':'Облачная синхронизация')+'</h2><button class="icon" onclick="$(\'cloudDialog\').close()">×</button></div><p id="cloudDialogStatus">'+esc(cloudStatusText)+'</p>';if(!cloudSession){const register=mode==='register';body+='<label>Email</label><input id="cloudEmail" type="email" autocomplete="email" placeholder="Твоя почта" value="'+esc(email)+'"><label>Пароль</label><input id="cloudPassword" type="password" autocomplete="'+(register?'new-password':'current-password')+'" placeholder="'+(register?'Придумай пароль (минимум 8 символов)':'Пароль от кабинета')+'">';if(register){body+='<label>Повтори пароль</label><input id="cloudConfirmPassword" type="password" autocomplete="new-password" placeholder="Повтори пароль"><div class="row"><button id="cloudSubmit" type="button" class="primary grow" onclick="cloudLogin(true)">Создать</button><button type="button" onclick="cloudSwitch(\'login\')">Назад</button></div><small>После регистрации подтверди почту по письму, затем войди в кабинет.</small>'}else{body+='<div class="row"><button id="cloudSubmit" type="button" class="primary grow" onclick="cloudLogin(false)">Войти</button><button type="button" onclick="cloudSwitch(\'register\')">Создать аккаунт</button></div><small>Вход на двух устройствах с одной почтой. Пароль не отправляется в чат.</small>'}}else{body+='<p>'+esc(cloudSession.user.email||'Личный аккаунт')+'</p>';if(cloudConflict?.type==='first')body+='<p>На первом устройстве с твоими записями нажми кнопку ниже. Затем войди с телефона.</p><button class="primary" onclick="cloudFirst()">Загрузить текущие данные в облако</button>';else if(cloudConflict?.type==='conflict')body+='<p>Данные изменились на другом устройстве. Выбери, какую версию оставить. Другая версия сохранится локальной резервной копией.</p><div class="row"><button class="primary" onclick="cloudUseRemote()">Взять из облака</button><button onclick="cloudUseLocal()">Оставить эту версию</button></div>';else body+='<button class="primary" onclick="cloudRetry()">Синхронизировать сейчас</button>';body+='<br><br><button onclick="cloudLogout()">Выйти из аккаунта</button><small>После выхода записи остаются в этом браузере.</small>'}dlg.innerHTML=body;document.body.append(dlg);dlg.addEventListener('close',()=>dlg.remove(),{once:true});dlg.showModal()}
function cloudSwitch(mode){cloudStatusText=mode==='register'?'Заполни данные для нового аккаунта':'Войди в свой аккаунт';openCloud(mode)}
async function cloudLogin(signup){if(!cloud)cloud=createJournalCloud();const email=$('cloudEmail').value.trim(),password=$('cloudPassword').value;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)||password.length<8){cloudSetStatus('Укажи email и пароль не короче 8 символов');return}if(signup&&$('cloudConfirmPassword')?.value!==password){cloudSetStatus('Пароли не совпадают');return}const btn=$('cloudSubmit');if(btn?.disabled)return;if(btn){btn.disabled=true;btn.textContent=signup?'Создание…':'Вход…'}cloudSetStatus('Подключение…');try{const {data,error}=signup?await cloud.auth.signUp({email,password}):await cloud.auth.signInWithPassword({email,password});if(error){cloudSetStatus((signup?'Не удалось создать аккаунт: ':'Не удалось войти: ')+error.message);return}if(!data.session){cloudStatusText='Проверь почту и подтверди регистрацию, затем войди.';openCloud('login',email);return}$('cloudDialog')?.close();await cloudAttach(data.session)}catch{cloudSetStatus('Не удалось подключиться')}finally{if(btn){btn.disabled=false;btn.textContent=signup?'Создать':'Войти'}}}
async function cloudRetry(){if(cloudReady)await cloudSync();else if(cloudSession)await cloudAttach(cloudSession)}
async function cloudLogout(){if(cloudReady)await cloudSync();cloudGeneration++;cloudReady=false;cloudSession=null;cloudConflict=null;clearTimeout(cloudTimer);await cloud.auth.signOut();cloudSetStatus('Облако не подключено');$('cloudDialog')?.close()}


const nutritionFields=[['calories','Калории','ккал'],['protein','Белки','г'],['fat','Жиры','г'],['carbs','Углеводы','г']];
const foodNumber=n=>Number.isFinite(Number(n))&&n!==''&&n!=null?Number(n):null;
const foodFormat=n=>n===null?'—':new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(n);
let healthDay=date(),healthMonth=new Date();
const activityFields=[['steps','Шаги','шагов'],['distance','Дистанция','км'],['activeCalories','Активные калории','ккал'],['minutes','Продолжительность','мин']];
const activityTypes=['Прогулка на улице','Кардио в зале','Силовая тренировка','Другое'];
function healthChoose(d){healthDay=d;healthMonth=new Date(d+'T12:00:00');render()}
function healthMonthChange(n){healthMonth=new Date(healthMonth.getFullYear(),healthMonth.getMonth()+n,1);render()}
function healthCalendar(){const y=healthMonth.getFullYear(),m=healthMonth.getMonth(),offset=(new Date(y,m,1).getDay()+6)%7,days=Array.from({length:new Date(y,m+1,0).getDate()},(_,i)=>date(new Date(y,m,i+1)));return card('Календарь здоровья','<div class="row spread"><button onclick="healthMonthChange(-1)" aria-label="Предыдущий месяц">‹</button><b>'+esc(healthMonth.toLocaleDateString('ru-RU',{month:'long',year:'numeric'}))+'</b><button onclick="healthMonthChange(1)" aria-label="Следующий месяц">›</button></div><div class="health-calendar">'+['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].map(x=>'<small>'+x+'</small>').join('')+Array.from({length:offset},()=>'<div></div>').join('')+days.map(d=>{const food=state.meals.some(x=>x.day===d),activity=state.activities.some(x=>x.day===d);return '<button class="health-cal-day '+(d===healthDay?'health-cal-selected':'')+'" onclick="healthChoose(\''+d+'\')" title="'+esc(fmt(d)+(food?' · Питание':'')+(activity?' · Активность':''))+'"><b>'+Number(d.slice(-2))+'</b><span class="health-cal-markers">'+(food?'<i class="health-food-dot"></i>':'')+(activity?'<i class="health-activity-dot"></i>':'')+'</span></button>'}).join('')+'</div><div class="health-legend"><span><i class="health-food-dot"></i> Питание</span><span><i class="health-activity-dot"></i> Активность</span></div>','<button class="small" onclick="healthChoose(date())">Сегодня</button>','health-calendar-card')}
function activityCard(day){const rows=state.activities.filter(x=>x.day===day);const summary='<div class="activity-summary">'+activityFields.map(([k,label,unit])=>{const values=rows.map(x=>foodNumber(x[k])).filter(x=>x!==null);return '<div><small>'+label+'</small><strong>'+foodFormat(values.length?values.reduce((a,b)=>a+b,0):null)+'</strong><small>'+unit+'</small></div>'}).join('')+'</div>';const list=rows.length?rows.map(x=>'<div class="activity-entry"><div class="row spread"><b>'+esc(x.title||x.type)+'</b><div class="row">'+controls('activities',x.id)+'</div></div>'+ (x.title&&x.title!==x.type?'<small>'+esc(x.type)+'</small>':'')+'<div class="activity-metrics">'+activityFields.filter(([k])=>foodNumber(x[k])!==null).map(([k,label,unit])=>'<span class="tag">'+esc(label)+': '+foodFormat(foodNumber(x[k]))+' '+unit+'</span>').join('')+'</div>'+(x.note?'<p class="muted">'+esc(x.note)+'</p>':'')+'</div>').join(''):'<div class="empty">Пока нет записей активности.</div>';return card('Активность',summary+list+'<small class="muted">Показатели суммируются по записям. Не записывай одну и ту же активность дважды. Активные калории не вычитаются из питания.</small>',add('activities',day),'health-activity')}
function editActivity(id,d){const m=id?state.activities.find(x=>x.id===id):{day:d||healthDay,type:activityTypes[0]};if(!m)return;$('modalTitle').textContent=id?'Редактировать активность':'Добавить активность';$('fields').innerHTML='<label>Дата<input name="day" type="date" required value="'+esc(m.day)+'"></label><label>Вид активности<select name="type">'+activityTypes.map(t=>'<option '+(m.type===t?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select></label><label>Название (необязательно)<input name="title" value="'+esc(m.title||'')+'" placeholder="Например, дорожка"></label><div class="formline">'+activityFields.map(([key,label,unit])=>'<label>'+esc(label)+', '+unit+'<input name="'+key+'" type="number" min="0" step="'+(key==='steps'?'1':'any')+'" inputmode="decimal" value="'+esc(m[key]??'')+'" placeholder="Необязательно"></label>').join('')+'</div><label>Заметка / упражнения<textarea name="note" placeholder="Скорость, наклон, подходы…">'+esc(m.note||'')+'</textarea></label>';const form=$('form'),commit=()=>{if(!form.reportValidity())return;const f=Object.fromEntries(new FormData(form));for(const [k] of activityFields)f[k]=foodNumber(f[k]);f.title=f.title.trim()||f.type;if(id)Object.assign(m,f);else state.activities.push({...f,id:uid()});healthDay=f.day;healthMonth=new Date(f.day+'T12:00:00');save();$('modal').close();render();notify('Активность сохранена')};$('saveEdit').onclick=commit;form.onsubmit=e=>{e.preventDefault();commit()};form.onkeydown=null;$('modal').showModal()}
function nutrition(){return banner('Здоровье','Питание и активность')+healthCalendar()+'<div class="health-date"><button onclick="healthChoose(shift(healthDay,-1))">‹</button><h2>'+esc(fmt(healthDay))+'</h2><button onclick="healthChoose(shift(healthDay,1))">›</button></div><div class="health-layout">'+nutritionDayCard(healthDay)+activityCard(healthDay)+'</div>'}
function nutritionDayCard(day){
 const rows=state.meals.filter(m=>m.day===day);
 const corrected=state.nutritionConfirmedTotals?.[day];const snapshot=items=>JSON.stringify(items.map(m=>[m.id,m.title,m.note||'',...nutritionFields.map(([key])=>foodNumber(m[key]))]).sort((a,b)=>String(a[0]).localeCompare(String(b[0]))));const confirmed=corrected&&Array.isArray(corrected.rows)&&snapshot(rows)===snapshot(corrected.rows);const totals=nutritionFields.map(([key])=>confirmed?foodNumber(corrected[key]):rows.reduce((sum,m)=>sum+(foodNumber(m[key])??0),0));
 const incomplete=nutritionFields.map(([key])=>rows.some(m=>foodNumber(m[key])===null));
 const summary='<div class="nutrition-summary">'+nutritionFields.map(([key,label,unit],index)=>'<div><small>'+label+'</small><strong>'+(!confirmed&&rows.length&&rows.every(m=>foodNumber(m[key])===null)?'—':foodFormat(totals[index])+(!confirmed&&incomplete[index]?'*':''))+'</strong><small>'+unit+'</small></div>').join('')+'</div>';
 const table='<div class="nutrition-scroll"><table class="nutrition-table"><thead><tr><th>Блюдо</th><th>Ккал</th><th>Белки, г</th><th>Жиры, г</th><th>Угл., г</th><th></th></tr></thead><tbody>'+ (rows.length?rows.map(m=>'<tr><td><strong>'+esc(m.title)+'</strong>'+(m.note?'<small>'+esc(m.note)+'</small>':'')+'</td>'+nutritionFields.map(([key])=>'<td>'+foodFormat(foodNumber(m[key]))+'</td>').join('')+'<td><div class="row nutrition-actions">'+controls('meals',m.id)+'</div></td></tr>').join(''):'<tr><td colspan="6" class="muted">Пока нет записей</td></tr>')+'</tbody></table></div>';
 return card('Питание','<div class="nutrition-day-layout"><div class="nutrition-left"><h3>Итого за день</h3>'+summary+(confirmed?'<small class="muted">Уточнённый итог дня. БЖУ отдельных продуктов предварительные и могут не совпадать с итогом.</small>':incomplete.some(Boolean)?'<small class="muted">* Итоги учитывают только заполненные значения. Прочерк — нет данных.</small>':'')+'</div><div class="nutrition-right"><h3>Продукты за день</h3>'+table+'</div></div>',add('meals',day),'nutrition-card health-food');

}
function editMeal(id,d){
 const m=id?state.meals.find(x=>x.id===id):{day:d||today};
 if(!m)return;
 $('modalTitle').textContent=id?'Редактировать блюдо':'Добавить блюдо';
 $('fields').innerHTML='<label>Дата<input name="day" type="date" required value="'+esc(m.day)+'"></label><label>Блюдо или продукт<input name="title" required maxlength="200" placeholder="Например, рис с курицей" value="'+esc(m.title||'')+'"></label><label>Количество / заметка<input name="note" placeholder="Например, 200 г" value="'+esc(m.note||'')+'"></label><div class="formline">'+nutritionFields.map(([key,label,unit])=>'<label>'+label+', '+unit+'<input name="'+key+'" type="number" inputmode="decimal" min="0" step="any" placeholder="0" value="'+esc(m[key]??'')+'"></label>').join('')+'</div>';
 const commit=()=>{const form=$('form');if(!form.reportValidity())return;const f=Object.fromEntries(new FormData(form));for(const [key] of nutritionFields)f[key]=foodNumber(f[key]);if(!f.title.trim()){notify('Введите название блюда');return}if(id)Object.assign(m,f);else state.meals.push({...f,id:uid()});healthDay=f.day;healthMonth=new Date(f.day+'T12:00:00');save();$('modal').close();render();notify('Запись сохранена')};
 $('saveEdit').onclick=commit;$('form').onsubmit=e=>{e.preventDefault();commit()};$('form').onkeydown=e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();commit()}};$('modal').showModal();
}

function render(){state.activities??=[];updateHabitPreset();state.brainScores??=[];state.speechNotes??={};state.warmups??={};state.gateRuns??={};updateMusicContent();for(const task of state.tasks)if(task.section==='Английский'||task.section==='Состояние')task.section='Главное';else if(task.section==='Блог и контент')task.section='Медийка';for(const session of state.focus)if(session.section==='Блог и контент')session.section='Медийка';nav();$('app').innerHTML=({home,week,habits,work,blog,nutrition}[page])();updateClock()}render();save();initCloud();let habitDisplayDate=date();setInterval(()=>{const current=date();if(current!==habitDisplayDate){habitDisplayDate=current;if(page==='home'||page==='habits'||(page==='work'&&!$('drillDialog')?.open))render()}},30000);
</script></body></html>
